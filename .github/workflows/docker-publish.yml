name: docker-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare project scratch
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/bun-opds-server"
          run_dir="${root}/runs/docker-publish/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "${root}/cache/xdg" \
            "${root}/build" \
            "${root}/tests" \
            "${root}/logs" \
            "${run_dir}/docker" \
            "${run_dir}/tmp"
          {
            printf 'PROJECT_TMP_BASE=%s\n' "$RUNNER_TEMP"
            printf 'PROJECT_TMP_ROOT=%s\n' "$root"
            printf 'CACHE_ROOT=%s\n' "${root}/cache"
            printf 'BUILD_ROOT=%s\n' "${root}/build"
            printf 'TEST_ROOT=%s\n' "${root}/tests"
            printf 'LOG_ROOT=%s\n' "${root}/logs"
            printf 'RUN_ROOT=%s\n' "${root}/runs"
            printf 'XDG_CACHE_HOME=%s\n' "${root}/cache/xdg"
            printf 'DOCKER_CONFIG=%s\n' "${run_dir}/docker"
            printf 'TMPDIR=%s\n' "${run_dir}/tmp"
            printf 'TMP=%s\n' "${run_dir}/tmp"
            printf 'TEMP=%s\n' "${run_dir}/tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
