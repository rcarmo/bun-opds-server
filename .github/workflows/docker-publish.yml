name: docker-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      PROJECT_TMP_ROOT: ${{ runner.temp }}/bun-opds-server
      CACHE_ROOT: ${{ runner.temp }}/bun-opds-server/cache
      BUILD_ROOT: ${{ runner.temp }}/bun-opds-server/build
      RUN_ROOT: ${{ runner.temp }}/bun-opds-server/runs
      XDG_CACHE_HOME: ${{ runner.temp }}/bun-opds-server/cache/xdg
      DOCKER_CONFIG: ${{ runner.temp }}/bun-opds-server/runs/docker-publish/${{ github.run_id }}-${{ github.run_attempt }}/docker
      TMPDIR: ${{ runner.temp }}/bun-opds-server/runs/docker-publish/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TMP: ${{ runner.temp }}/bun-opds-server/runs/docker-publish/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TEMP: ${{ runner.temp }}/bun-opds-server/runs/docker-publish/${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - name: Prepare project scratch
        run: |
          mkdir -p \
            "$CACHE_ROOT/xdg" \
            "$BUILD_ROOT" \
            "$DOCKER_CONFIG" \
            "$TMPDIR"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
